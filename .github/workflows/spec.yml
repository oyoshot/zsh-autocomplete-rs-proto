name: Specification

on:
  push:
    branches: [main]
    paths:
      - docs/design/adapter-contract-spec/**
      - docs/adapter-contract.md
      - .github/workflows/spec.yml
  pull_request:
    paths:
      - docs/design/adapter-contract-spec/**
      - docs/adapter-contract.md
      - .github/workflows/spec.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    name: TLC
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Download TLC
        # The latest release, like the Kani job: no version to maintain here.
        run: curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
      - name: Check every configuration
        run: TLC="java -XX:+UseParallelGC -cp $RUNNER_TEMP/tla2tools.jar tlc2.TLC" sh docs/design/adapter-contract-spec/check.sh
